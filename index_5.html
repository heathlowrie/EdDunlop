<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tales of Castles — We're Moving</title>
<meta name="description" content="Tales of Castles is moving to Sword of the Lord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a227;
    --gold-bright:#e8c85a;
    --parchment:#f3ead2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;min-height:100%;}
  body{
    font-family:'EB Garamond', serif;
    color:var(--parchment);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background-color:#151013;
    background-image:
      linear-gradient(180deg, rgba(10,7,8,0.55) 0%, rgba(10,7,8,0.35) 35%, rgba(10,7,8,0.55) 65%, rgba(8,6,7,0.85) 100%),
      url('images/castle-bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
  }
  @media (max-width:768px){
    body{ background-attachment:scroll; }
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:820px;
    margin:0 auto;
    padding:40px 28px;
    text-align:center;
  }

  .eyebrow{
    font-family:'Cinzel', serif;
    font-weight:600;
    letter-spacing:0.4em;
    text-transform:uppercase;
    font-size:12.5px;
    color:var(--gold-bright);
    margin:0 0 26px;
    text-shadow:0 2px 10px rgba(0,0,0,0.7);
  }

  h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:clamp(32px, 6vw, 58px);
    line-height:1.22;
    margin:0 0 26px;
    color:var(--parchment);
    text-shadow:0 4px 24px rgba(0,0,0,0.85), 0 2px 4px rgba(0,0,0,0.9);
    letter-spacing:0.01em;
  }
  h1 .accent{ color:var(--gold-bright); }

  .sub{
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-size:clamp(17px, 2.3vw, 21px);
    color:var(--parchment);
    max-width:560px;
    margin:0 auto 38px;
    line-height:1.6;
    text-shadow:0 2px 14px rgba(0,0,0,0.85);
    opacity:0.95;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:12px;
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#241407;
    text-decoration:none;
    padding:19px 40px;
    border-radius:4px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    box-shadow:0 12px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.4);
    border:1px solid rgba(255,236,180,0.6);
    transition:transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  .cta:hover{ transform:translateY(-2px); filter:brightness(1.06); box-shadow:0 16px 34px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.45); }
  .cta:active{ transform:translateY(0); }
  .cta:focus-visible{ outline:3px solid var(--gold-bright); outline-offset:4px; }
  .cta svg{ width:18px; height:18px; }

  .cta-note{
    margin-top:22px;
    font-size:13.5px;
    color:var(--parchment);
    opacity:0.75;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }
  .cta-note a{ color:var(--parchment); text-decoration:underline; text-decoration-color:rgba(243,234,210,0.4); }
</style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Tales of Castles</p>
    <h1>All book sales have moved to<br><span class="accent">Sword of the Lord</span></h1>
    <p class="sub">Please click below to be redirected to our new home.</p>

    <a class="cta" href="https://swordbooks.com/collections/ed-dunlop">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="#241407" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Click here to be redirected
    </a>

    <p class="cta-note">or visit <a href="https://swordbooks.com/collections/ed-dunlop">swordbooks.com/collections/ed-dunlop</a></p>
  </main>
</body>
</html>
